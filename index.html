<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 3 - HTML CSS</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: #f5f5f5;
            color: #333;
        }

        h1 {
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            margin-bottom: 12px;
        }

        ul li a {
            color: #e84118;
            font-size: 16px;
            text-decoration: none;
            padding: 10px 16px;
            border: 1px solid #e84118;
            border-radius: 8px;
            display: inline-block;
            background: #fff;
        }

        ul li a:hover {
            background: #e84118;
            color: #fff;
        }
    </style>
</head>
